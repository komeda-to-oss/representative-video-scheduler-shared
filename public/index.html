<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>代表動画 投稿スケジューラー</title>
  <style>
    :root {
      --ink: #172029;
      --muted: #63717c;
      --line: #dce3e8;
      --paper: #ffffff;
      --surface: #f3f7f8;
      --teal: #087f73;
      --teal-dark: #06675e;
      --green: #21875b;
      --red: #c74331;
      --amber: #f3b33d;
      --shadow: 0 10px 28px rgba(24, 43, 56, .1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--surface);
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    body:not(.unlocked) .topbar,
    body:not(.unlocked) main {
      display: none;
    }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      padding: 10px max(18px, calc((100vw - 1440px) / 2));
      color: #fff;
      background: #172029;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .18);
    }

    .brand { min-width: 0; }
    .brand strong { display: block; font-size: 20px; line-height: 1.25; }
    .brand span { color: #b7c6ce; font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }

    .button, .icon-button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-weight: 800;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 14px;
      white-space: nowrap;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 42px;
      padding: 0;
      color: #fff;
      background: #31404a;
      font-size: 18px;
    }

    .icon-button:hover { background: #40525e; }
    .button.primary { color: #fff; background: var(--teal); }
    .button.primary:hover { background: var(--teal-dark); }
    .button.secondary { color: var(--ink); border-color: var(--line); background: #fff; }
    .button.secondary:hover { background: #eef3f4; }
    .button.danger { color: #a22f21; border-color: #ebc2ba; background: #fff7f5; }
    .button.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #b7c6ce;
      font-size: 12px;
    }

    .connection::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      content: "";
    }

    .connection.offline::before { background: var(--red); }
    .connection.saving::before { background: var(--amber); }

    main {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 22px 18px 60px;
    }

    .month-toolbar {
      display: grid;
      grid-template-columns: auto minmax(210px, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .month-nav { display: flex; align-items: center; gap: 8px; }
    .month-nav input {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
    }

    .month-title { min-width: 0; text-align: center; }
    .month-title h1 { margin: 0; font-size: 26px; line-height: 1.2; }
    .month-title p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin: 25px 0 12px;
    }

    .section-head h2 { margin: 0; font-size: 19px; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .section-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .video-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(130px, 42%) minmax(0, 1fr);
      min-height: 320px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .video-card.is-posted {
      border-color: #64b58c;
      box-shadow: 0 10px 28px rgba(20, 104, 70, .16);
    }

    .visual {
      position: relative;
      min-height: 320px;
      border: 0;
      padding: 0;
      overflow: hidden;
      color: #fff;
      background: #101719;
    }

    .visual img,
    .visual video {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 320px;
      object-fit: cover;
      object-position: center;
      background: #101719;
    }

    .visual-placeholder {
      display: grid;
      place-items: center;
      height: 100%;
      min-height: 320px;
      padding: 18px;
      text-align: center;
      background: #24343e;
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 5px 20px rgba(0, 0, 0, .28);
      transform: translate(-50%, -50%);
      font-size: 21px;
    }

    .visual-badge {
      position: absolute;
      left: 10px;
      top: 10px;
      border-radius: 999px;
      padding: 6px 9px;
      color: #073f29;
      background: rgba(224, 248, 236, .96);
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
    }

    .card-content {
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: 13px;
    }

    .number-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .status {
      border: 0;
      border-radius: 999px;
      padding: 5px 8px;
      color: #7c5410;
      background: #fff0c9;
      font-size: 11px;
      font-weight: 800;
    }

    .status.ready { color: #0d6843; background: #dff4e9; }

    .title-input {
      width: 100%;
      margin: 10px 0;
      border: 0;
      border-bottom: 2px solid var(--line);
      padding: 5px 1px 8px;
      color: var(--ink);
      background: transparent;
      font-size: 16px;
      font-weight: 800;
    }

    .title-input:focus { outline: 0; border-color: var(--teal); }

    .date-control {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 34px;
      gap: 5px;
      align-items: center;
    }

    .date-control input {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      border: 1px solid #bdc8cf;
      border-radius: 6px;
      padding: 7px 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
    }

    .step {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #eef3f4;
      font-size: 18px;
      font-weight: 900;
    }

    .file-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: auto;
      padding-top: 11px;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px;
      background: #f7f9fa;
      color: inherit;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      appearance: none;
    }

    .file-label input { display: none; }
    .file-label:hover { border-color: var(--teal); color: var(--teal-dark); }

    .posted-toggle {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border: 1px solid #aacfc3;
      border-radius: 6px;
      padding: 9px 10px;
      color: #0f5148;
      background: #edf8f6;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 4px 14px rgba(35, 128, 112, .12);
    }

    .posted-toggle.is-posted {
      color: #fff;
      border-color: #0d6843;
      background: #168052;
    }

    .posted-toggle.compact {
      min-height: 38px;
      margin-top: 0;
      padding: 7px 9px;
      font-size: 12px;
      white-space: nowrap;
    }

    .posted-toggle.card-primary {
      order: -1;
      margin: 8px 0 10px;
      border-width: 2px;
      font-size: 14px;
    }

    .posted-toggle.visual-floating {
      position: absolute;
      z-index: 5;
      top: 10px;
      right: 10px;
      width: auto;
      min-height: 36px;
      margin: 0;
      padding: 6px 10px;
      border-color: rgba(255, 255, 255, .72);
      color: #073f29;
      background: rgba(235, 249, 244, .96);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .24);
      font-size: 12px;
    }

    .posted-toggle.visual-floating.is-posted {
      color: #fff;
      border-color: rgba(255, 255, 255, .45);
      background: #168052;
    }

    .upload-status {
      grid-column: 1 / -1;
      display: grid;
      gap: 5px;
      margin-top: 4px;
      padding: 8px;
      border: 1px solid #d5e7e4;
      border-radius: 6px;
      color: #0f5148;
      background: #f1fbf9;
      font-size: 12px;
      font-weight: 800;
    }

    .upload-status progress {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      background: #d7e9e6;
      appearance: none;
    }

    .upload-status progress::-webkit-progress-bar {
      background: #d7e9e6;
      border-radius: 999px;
    }

    .upload-status progress::-webkit-progress-value {
      background: var(--teal);
      border-radius: 999px;
    }

    .download-button {
      min-height: 38px;
      border: 1px solid #b8d9d5;
      border-radius: 6px;
      padding: 7px;
      color: var(--teal-dark);
      background: #edf8f6;
      font-size: 12px;
      font-weight: 800;
    }

    .download-button:hover { border-color: var(--teal); background: #dff2ef; }
    .download-button:disabled { cursor: not-allowed; opacity: .45; }

    .schedule-band {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .schedule-row {
      display: grid;
      grid-template-columns: 54px minmax(150px, 1fr) minmax(180px, 1.45fr) 102px 124px;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
    }

    .schedule-row:last-child { border-bottom: 0; }
    .schedule-row strong { font-size: 13px; }
    .schedule-row input {
      width: 100%;
      min-height: 40px;
      border: 1px solid #c5ced4;
      border-radius: 6px;
      padding: 7px 9px;
      background: #fff;
    }

    .history-list { display: grid; gap: 10px; }
    .history-month {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .history-month summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      cursor: pointer;
      font-weight: 900;
    }

    .history-month summary span { color: var(--muted); font-size: 12px; }
    .history-content { padding: 0 14px 14px; }
    .history-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .empty { padding: 24px; color: var(--muted); text-align: center; }

    dialog {
      width: min(620px, calc(100% - 24px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      border: 0;
      border-radius: 8px;
      padding: 0;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .35);
    }

    dialog::backdrop { background: rgba(18, 28, 34, .62); }
    .dialog-head {
      position: sticky;
      z-index: 2;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .dialog-head h2 { margin: 0; font-size: 18px; }
    .dialog-body { display: grid; gap: 15px; padding: 18px; }
    .dialog-footer {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 13px 18px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .field { display: grid; gap: 6px; }
    .field label { font-size: 13px; font-weight: 800; }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #bec8ce;
      border-radius: 6px;
      padding: 9px 10px;
      color: var(--ink);
      background: #fff;
    }

    .field textarea { min-height: 118px; resize: vertical; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .media-dialog {
      width: min(920px, calc(100% - 24px));
      color: #fff;
      background: #101719;
    }

    .media-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .12);
      background: #172029;
    }

    .media-head strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .media-head .icon-button { flex: 0 0 auto; }
    .media-body { position: relative; background: #101719; }
    .media-dialog video, .media-dialog img {
      display: block;
      width: 100%;
      max-height: calc(100vh - 145px);
      object-fit: contain;
      background: #101719;
    }

    .media-status {
      padding: 12px 14px;
      color: #d8e3e8;
      background: #172029;
      font-size: 13px;
    }

    .lock {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #172029;
    }

    .lock-panel {
      width: min(390px, 100%);
      border-radius: 8px;
      padding: 26px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }

    .lock-panel h1 { margin: 0 0 6px; font-size: 23px; }
    .lock-panel p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .lock-panel input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #aebbc3;
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 18px;
    }

    .lock-panel .button { width: 100%; margin-top: 10px; }
    .error { min-height: 20px; margin-top: 8px; color: #b63325; font-size: 13px; }

    .toast {
      position: fixed;
      z-index: 120;
      right: 18px;
      bottom: 18px;
      max-width: min(360px, calc(100vw - 36px));
      border-radius: 6px;
      padding: 11px 14px;
      color: #fff;
      background: #172029;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: .18s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1100px) {
      .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .topbar { min-height: 60px; }
      .brand strong { font-size: 16px; }
      .brand span, .connection { display: none; }
      main { padding: 14px 10px 46px; }
      .month-toolbar { grid-template-columns: 1fr auto; }
      .month-nav { grid-column: 1 / -1; justify-content: center; }
      .month-title { text-align: left; }
      .month-title h1 { font-size: 21px; }
      .video-grid { grid-template-columns: 1fr; }
      .video-card { grid-template-columns: minmax(118px, 38%) minmax(0, 1fr); min-height: 292px; }
      .visual, .visual img, .visual video, .visual-placeholder { min-height: 292px; }
      .date-control { grid-template-columns: 1fr 1fr; }
      .date-control input { grid-column: 1 / -1; grid-row: 1; padding: 7px 5px; font-size: 13px; }
      .date-control .step { grid-row: 2; }
      .section-head { align-items: stretch; flex-direction: column; }
      .section-actions { justify-content: flex-start; }
      .schedule-row { grid-template-columns: 42px minmax(145px, 1fr) 92px; gap: 8px; }
      .schedule-row .schedule-title { grid-column: 2 / -1; grid-row: 2; }
      .schedule-row .posted-toggle { grid-column: 1 / -1; grid-row: 3; }
      .field-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 8px; }
      .top-actions { width: 100%; justify-content: space-between; }
      .month-toolbar { grid-template-columns: 1fr; }
      .month-nav { justify-content: stretch; }
      .month-nav input { flex: 1; min-width: 0; }
      .video-card { grid-template-columns: 1fr; min-height: 0; }
      .visual, .visual img, .visual video, .visual-placeholder {
        min-height: 0;
        aspect-ratio: 9 / 16;
      }
      .file-actions { grid-template-columns: 1fr 1fr; }
      .file-label, .download-button, .posted-toggle { min-height: 44px; }
      .section-actions .button { flex: 1 1 calc(50% - 8px); }
      .schedule-row { grid-template-columns: 1fr 1fr; }
      .schedule-row strong { grid-column: 1; }
      .schedule-row input[type="date"] { grid-column: 2; }
      .schedule-row .schedule-title { grid-column: 1 / -1; grid-row: auto; }
      .schedule-row .status,
      .schedule-row .posted-toggle { grid-column: auto; grid-row: auto; }
    }
  </style>
</head>
<body>
  <div class="lock" id="lock">
    <form class="lock-panel" id="loginForm">
      <h1>代表動画スケジューラー</h1>
      <p>共有パスワードを入れてください。</p>
      <input id="passcode" type="password" autocomplete="current-password" aria-label="共有パスワード">
      <button class="button primary" type="submit">ログイン</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <header class="topbar">
    <div class="brand">
      <strong>代表動画 投稿スケジューラー</strong>
      <span>リンクとパスワードを知っている人だけが編集できます</span>
    </div>
    <div class="top-actions">
      <span class="connection" id="connection">同期中</span>
      <button class="button secondary" id="openSettings" type="button">設定</button>
    </div>
  </header>

  <main>
    <div class="month-toolbar">
      <div class="month-nav">
        <button class="icon-button" id="prevMonth" type="button" title="前の月" aria-label="前の月">&lt;</button>
        <input id="monthPicker" type="month" aria-label="表示する月">
        <button class="icon-button" id="nextMonth" type="button" title="次の月" aria-label="次の月">&gt;</button>
      </div>
      <div class="month-title">
        <h1 id="monthTitle">-</h1>
        <p id="monthSummary">-</p>
      </div>
      <button class="button secondary" id="reloadState" type="button">更新</button>
    </div>

    <section>
      <div class="section-head">
        <div>
          <h2>今月の動画</h2>
          <p>普段は6本。必要な時だけ枠を追加できます。</p>
        </div>
        <div class="section-actions">
          <button class="button secondary" id="addSlot" type="button">枠を追加</button>
          <button class="button danger" id="clearCurrent" type="button">今月を全削除</button>
          <button class="button primary" id="archiveCurrent" type="button">履歴に保存</button>
          <button class="button secondary" id="newMonth" type="button">新しい月</button>
        </div>
      </div>
      <div class="video-grid" id="videoGrid"></div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <h2>投稿カレンダー</h2>
          <p>日付とタイトルはここでも編集できます。</p>
        </div>
      </div>
      <div class="schedule-band" id="scheduleList"></div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <h2>過去の履歴</h2>
          <p>保存した月の確認、復元、削除ができます。</p>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form id="settingsForm">
      <div class="dialog-head">
        <h2>スケジュール設定</h2>
        <button class="icon-button" id="closeSettings" type="button" aria-label="閉じる">x</button>
      </div>
      <div class="dialog-body">
        <div class="field-grid">
          <div class="field">
            <label for="shootDate">撮影日</label>
            <input id="shootDate" type="date">
          </div>
          <div class="field">
            <label for="startDate">初回投稿日</label>
            <input id="startDate" type="date">
          </div>
          <div class="field">
            <label for="interval">投稿間隔</label>
            <select id="interval">
              <option value="5">5日ごと</option>
              <option value="7">毎週</option>
              <option value="10">10日ごと</option>
              <option value="14">隔週</option>
            </select>
          </div>
          <div class="field">
            <label for="channel">投稿先</label>
            <select id="channel">
              <option>YouTube</option>
              <option>Instagram</option>
              <option>TikTok</option>
              <option>LinkedIn</option>
              <option>X</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="titles">動画タイトル（1行に1本）</label>
          <textarea id="titles"></textarea>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="button secondary" id="cancelSettings" type="button">閉じる</button>
        <button class="button primary" type="submit">設定を反映</button>
      </div>

  </dialog>

  <dialog class="media-dialog" id="mediaDialog">
    <div class="media-head">
      <strong id="mediaTitle">プレビュー</strong>
      <button class="icon-button" id="closeMedia" type="button" aria-label="閉じる">x</button>
    </div>
    <div class="media-body">
      <video id="mediaVideo" controls playsinline preload="metadata" hidden></video>
      <img id="mediaImage" alt="" hidden>
      <div class="media-status" id="mediaStatus" hidden></div>
    </div>
  </dialog>

  <dialog id="newMonthDialog">
    <form id="newMonthForm">
      <div class="dialog-head">
        <h2>新しい月を作る</h2>
        <button class="icon-button" id="closeNewMonth" type="button" aria-label="閉じる">x</button>
      </div>
      <div class="dialog-body">
        <div class="field">
          <label for="newMonthValue">対象月</label>
          <input id="newMonthValue" type="month" required>
        </div>
      </div>
      <div class="dialog-footer">
        <button class="button secondary" id="cancelNewMonth" type="button">キャンセル</button>
        <button class="button primary" type="submit">6枠を作る</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const APP_BUILD = "2026-07-16-fast-upload-20mb-1";
    if (location.pathname.endsWith("/public/")) {
      location.replace(`${location.origin}${location.pathname}index.html?v=${APP_BUILD}`);
    }

    const CLOUDINARY = {
      cloudName: "bzjc7oyt",
      uploadPreset: "scheduler_shared_uploads",
      password: "SNova0101",
      stateBase: "representative-video-scheduler/state/state-",
      mediaBase: "representative-video-scheduler/media/"
    };
    const LOCAL_TEST_UNLOCK = location.protocol === "file:" && new URLSearchParams(location.search).get("localTest") === "1";
    const MAX_DIRECT_UPLOAD_BYTES = 95 * 1024 * 1024;
    const CHUNK_UPLOAD_BYTES = 20 * 1024 * 1024;
    const $ = (selector) => document.querySelector(selector);
    const lock = $("#lock");
    const loginForm = $("#loginForm");
    const loginError = $("#loginError");
    const videoGrid = $("#videoGrid");
    const scheduleList = $("#scheduleList");
    const historyList = $("#historyList");
    const monthPicker = $("#monthPicker");
    const settingsDialog = $("#settingsDialog");
    const newMonthDialog = $("#newMonthDialog");
    const mediaDialog = $("#mediaDialog");
    const mediaVideo = $("#mediaVideo");
    const mediaImage = $("#mediaImage");
    const mediaTitle = $("#mediaTitle");
    const mediaStatus = $("#mediaStatus");
    const connection = $("#connection");
    const toast = $("#toast");

    let state = null;
    let saveTimer = null;
    let hasLocalChanges = false;
    let isSaving = false;
    let knownMissingRevision = null;
    let lastPollAt = 0;

    function unlockApp({ remember = true } = {}) {
      if (remember) localStorage.setItem("schedulerUnlocked", "1");
      document.body.classList.add("unlocked");
      lock.hidden = true;
    }

    function todayMonth() {
      const date = new Date();
      return date.toISOString().slice(0, 7);
    }

    function addDays(value, amount) {
      const date = new Date(`${value || new Date().toISOString().slice(0, 10)}T00:00:00`);
      date.setDate(date.getDate() + amount);
      return date.toISOString().slice(0, 10);
    }

    function formatMonth(value) {
      if (!value) return "-";
      const [year, month] = value.split("-");
      return `${year}年${Number(month)}月`;
    }

    function formatDate(value) {
      if (!value) return "-";
      const [year, month, day] = value.split("-");
      return `${Number(month)}/${Number(day)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function showToast(message, duration = 2600) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), duration);
    }

    function setConnection(mode, label) {
      connection.classList.toggle("offline", mode === "offline");
      connection.classList.toggle("saving", mode === "saving");
      connection.textContent = label || (mode === "offline" ? "未接続" : mode === "saving" ? "保存中" : "同期中");
    }

    function formatFileSize(bytes) {
      const size = Number(bytes || 0);
      if (!Number.isFinite(size) || size <= 0) return "0MB";
      const units = ["B", "KB", "MB", "GB"];
      let value = size;
      let unitIndex = 0;
      while (value >= 1024 && unitIndex < units.length - 1) {
        value /= 1024;
        unitIndex += 1;
      }
      return `${value >= 10 || unitIndex === 0 ? value.toFixed(0) : value.toFixed(1)}${units[unitIndex]}`;
    }

    function cloudinaryErrorMessage(error, fallback = "Cloudinaryで失敗しました") {
      if (!error) return fallback;
      if (typeof error === "string") return error.slice(0, 240) || fallback;
      const candidates = [
        error.message,
        error.statusText,
        error.error?.message,
        error.info?.error?.message,
        error.result?.error?.message
      ].filter(Boolean);
      if (candidates.length) return String(candidates[0]).slice(0, 240);
      try {
        const text = JSON.stringify(error);
        return text ? text.slice(0, 240) : fallback;
      } catch {
        return fallback;
      }
    }

    function cloudinaryRequestError(request, result, fallback) {
      const headerError = request.getResponseHeader("X-Cld-Error");
      const detail = result?.error?.message || headerError || fallback;
      return `${fallback} (${request.status || "通信エラー"}): ${cloudinaryErrorMessage(detail, fallback)}`;
    }

    function stateUrl(revision) {
      return `https://res.cloudinary.com/${CLOUDINARY.cloudName}/raw/upload/${CLOUDINARY.stateBase}${revision}.js`;
    }

    function uploadUrl(resourceType = "auto") {
      return `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/${resourceType}/upload`;
    }

    async function fetchRevision(revision) {
      const key = `__schedulerState${revision}`;
      delete window[key];
      return new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = `${stateUrl(revision)}?cb=${Date.now()}`;
        script.async = true;
        script.onload = () => {
          script.remove();
          resolve(window[key] || null);
          delete window[key];
        };
        script.onerror = () => {
          script.remove();
          resolve(null);
          delete window[key];
        };
        document.head.appendChild(script);
      });
    }

    async function findLatestState() {
      let latest = null;
      let revision = 1;
      const maxRevision = knownMissingRevision ? Math.max(knownMissingRevision + 25, 80) : 250;
      while (revision <= maxRevision) {
        const candidate = await fetchRevision(revision);
        if (!candidate) {
          knownMissingRevision = revision;
          break;
        }
        latest = normalizeState(candidate);
        revision += 1;
      }
      return latest;
    }

    function blankRow(index, date) {
      return {
        postDate: date,
        title: `動画${index + 1}`,
        memo: "",
        ready: false,
        tiktokPosted: false,
        tiktokPostedAt: "",
        thumbUrl: "",
        thumbName: "",
        videoUrl: "",
        videoFileName: ""
      };
    }

    function blankMonth(month, count = 6) {
      const [year, monthNumber] = month.split("-").map(Number);
      const dateValue = (day) => {
        const date = new Date(year, monthNumber - 1, day);
        return date.toISOString().slice(0, 10);
      };
      return {
        month,
        shootDate: dateValue(5),
        startDate: dateValue(8),
        interval: "7",
        channel: state?.active?.channel || "YouTube",
        rows: Array.from({ length: count }, (_, index) => blankRow(index, dateValue(8 + index * 7)))
      };
    }

    function initialState() {
      return {
        revision: 0,
        updatedAt: new Date().toISOString(),
        active: blankMonth(todayMonth(), 6),
        archives: {}
      };
    }

    function normalizeState(input) {
      const base = initialState();
      const next = input && typeof input === "object" ? input : base;
      next.revision = Number(next.revision || 0);
      next.archives = next.archives && typeof next.archives === "object" ? next.archives : {};
      next.active = next.active && typeof next.active === "object" ? next.active : base.active;
      next.active.rows = Array.isArray(next.active.rows) ? next.active.rows : base.active.rows;
      next.active.rows = next.active.rows.map((row, index) => ({
        ...blankRow(index, row?.postDate || base.active.rows[index]?.postDate),
        ...row,
        title: row?.title || `動画${index + 1}`
      }));
      Object.values(next.archives || {}).forEach((snapshot) => {
        if (!Array.isArray(snapshot?.rows)) return;
        snapshot.rows = snapshot.rows.map((row, index) => ({
          ...blankRow(index, row?.postDate || snapshot.startDate || base.active.rows[index]?.postDate),
          ...row,
          title: row?.title || `動画${index + 1}`
        }));
      });
      return next;
    }

    async function loadLatest({ quiet = false } = {}) {
      try {
        setConnection("saving", "読込中");
        const latest = await findLatestState();
        state = latest || initialState();
        setConnection("online", "同期中");
        render();
        if (!quiet) showToast("最新データを読み込みました");
      } catch (error) {
        state = state || initialState();
        setConnection("offline", "読込失敗");
        render();
        if (!quiet) showToast("共有データの読み込みに失敗しました");
      }
    }

    function cleanRowForSave(row) {
      const {
        localVideoPreviewUrl,
        videoUploadStatus,
        videoUploadProgress,
        videoUploadError,
        ...clean
      } = row || {};
      return clean;
    }

    function stateForSave(targetRevision) {
      const payload = structuredClone(state);
      payload.revision = targetRevision;
      payload.updatedAt = new Date().toISOString();
      if (payload.active?.rows) {
        payload.active.rows = payload.active.rows.map(cleanRowForSave);
      }
      Object.values(payload.archives || {}).forEach((snapshot) => {
        if (snapshot?.rows) snapshot.rows = snapshot.rows.map(cleanRowForSave);
      });
      return payload;
    }

    async function uploadJsonState(targetRevision) {
      const form = new FormData();
      const payload = stateForSave(targetRevision);
      const scriptText = `window.__schedulerState${targetRevision}=${JSON.stringify(payload)};`;
      const blob = new Blob([scriptText], { type: "text/javascript" });
      form.append("file", blob, `state-${targetRevision}.js`);
      form.append("upload_preset", CLOUDINARY.uploadPreset);
      form.append("public_id", `${CLOUDINARY.stateBase}${targetRevision}.js`);
      form.append("resource_type", "raw");
      form.append("tags", "representative-video-scheduler-state");
      const response = await fetch(uploadUrl("raw"), { method: "POST", body: form });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error?.message || "状態を保存できませんでした");
      state.revision = targetRevision;
      state.updatedAt = payload.updatedAt;
      knownMissingRevision = targetRevision + 1;
      return result;
    }

    async function persistState(message = "全員の画面に反映しました") {
      if (!state || isSaving) return;
      isSaving = true;
      hasLocalChanges = true;
      setConnection("saving", "保存中");
      try {
        let targetRevision = Number(state.revision || 0) + 1;
        for (let attempt = 0; attempt < 4; attempt += 1) {
          try {
            await uploadJsonState(targetRevision);
            hasLocalChanges = false;
            setConnection("online", "同期中");
            showToast(message);
            render();
            return;
          } catch (error) {
            const latest = await findLatestState().catch(() => null);
            targetRevision = Math.max(targetRevision + 1, Number(latest?.revision || 0) + 1);
          }
        }
        throw new Error("保存できませんでした");
      } catch (error) {
        setConnection("offline", "保存失敗");
        showToast(error.message || "保存に失敗しました");
      } finally {
        isSaving = false;
      }
    }

    function scheduleSave() {
      hasLocalChanges = true;
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => persistState("変更を全員に反映しました"), 700);
    }

    function savedVideoSource(row) {
      return row.videoUrl || "";
    }

    function videoSource(row) {
      return row.localVideoPreviewUrl || savedVideoSource(row);
    }

    function cloudinaryVideoPlaybackUrl(url) {
      const value = String(url || "");
      if (!value.includes("/video/upload/")) return value;
      const [clean, suffix = ""] = value.split(/(?=[?#])/);
      const transformed = clean
        .replace("/video/upload/", "/video/upload/f_mp4,vc_auto,q_auto:eco,w_720,c_limit/")
        .replace(/\.(mov|m4v|avi|mkv|webm|3gp)$/i, ".mp4");
      return `${transformed}${suffix}`;
    }

    function videoPlaybackSource(row) {
      if (row.localVideoPreviewUrl) return row.localVideoPreviewUrl;
      return savedVideoSource(row) || row.videoPlaybackUrl || cloudinaryVideoPlaybackUrl(savedVideoSource(row)) || "";
    }

    function videoPlaybackSources(row) {
      return [...new Set([
        row.localVideoPreviewUrl || "",
        savedVideoSource(row),
        row.videoPlaybackUrl || "",
        cloudinaryVideoPlaybackUrl(savedVideoSource(row))
      ].filter(Boolean))];
    }

    function videoMimeType(url) {
      const clean = String(url || "").split("?")[0].toLowerCase();
      if (clean.includes("/f_mp4,") || clean.endsWith(".mp4")) return "video/mp4";
      if (clean.endsWith(".webm")) return "video/webm";
      if (clean.endsWith(".mov") || clean.endsWith(".m4v")) return "video/mp4";
      return "";
    }

    function setMediaStatus(message) {
      mediaStatus.textContent = message || "";
      mediaStatus.hidden = !message;
    }

    function thumbSource(row) {
      return row.thumbUrl || "";
    }

    function renderVisual(row, index) {
      const thumb = thumbSource(row);
      const video = videoPlaybackSource(row);
      const badge = row.tiktokPosted ? `<span class="visual-badge">TikTok投稿済み</span>` : "";
      if (thumb) {
        return `${badge}<img src="${escapeHtml(thumb)}" alt="${escapeHtml(row.title)}のサムネイル">${video ? `<span class="play">▶</span>` : ""}`;
      }
      if (video) {
        return `${badge}<video src="${escapeHtml(video)}" muted playsinline preload="metadata"></video><span class="play">▶</span>`;
      }
      return `${badge}<span class="visual-placeholder">No.${index + 1}<br>${escapeHtml(row.title)}</span>`;
    }

    function postedButtonMarkup(row, index, compact = false, cardPrimary = false, visualFloating = false) {
      const label = visualFloating
        ? (row.tiktokPosted ? "投稿済み ✓" : "投稿済みにする")
        : (row.tiktokPosted ? "TikTok投稿済み ✓" : compact ? "TikTok未投稿" : "TikTok投稿済みにする");
      return `
        <button class="posted-toggle ${compact ? "compact" : ""} ${cardPrimary ? "card-primary" : ""} ${visualFloating ? "visual-floating" : ""} ${row.tiktokPosted ? "is-posted" : ""}" type="button" data-action="toggle-posted" data-index="${index}" aria-pressed="${row.tiktokPosted ? "true" : "false"}">
          ${label}
        </button>
      `;
    }

    function uploadStatusMarkup(row) {
      if (!row.videoUploadStatus) return "";
      const progress = Math.max(0, Math.min(100, Number(row.videoUploadProgress || 0)));
      return `
        <div class="upload-status">
          <span>${escapeHtml(row.videoUploadStatus)}</span>
          <progress value="${progress}" max="100"></progress>
        </div>
      `;
    }

    function render() {
      if (!state?.active) return;
      const active = state.active;
      const rows = active.rows || [];
      monthPicker.value = active.month;
      $("#monthTitle").textContent = formatMonth(active.month);
      $("#monthSummary").textContent = `${rows.length}本・${active.channel || "投稿先未設定"}・撮影 ${formatDate(active.shootDate)}・保存Rev ${state.revision || 0}`;

      videoGrid.innerHTML = rows.map((row, index) => {
        const video = videoSource(row);
        const savedVideo = savedVideoSource(row);
        const thumb = thumbSource(row);
        return `
          <article class="video-card ${row.tiktokPosted ? "is-posted" : ""}" data-index="${index}">
            <button class="visual" type="button" data-action="preview" data-index="${index}" aria-label="No.${index + 1}を確認">
              ${renderVisual(row, index)}
            </button>
            ${postedButtonMarkup(row, index, true, false, true)}
            <div class="card-content">
              <div class="number-line">
                <span>No.${index + 1}</span>
                <button class="status ${row.ready ? "ready" : ""}" type="button" data-action="ready" data-index="${index}">
                  ${row.ready ? "準備OK" : "未完了"}
                </button>
              </div>
              ${postedButtonMarkup(row, index, false, true)}
              <input class="title-input" data-field="title" data-index="${index}" value="${escapeHtml(row.title)}" aria-label="No.${index + 1}のタイトル">
              <div class="date-control">
                <button class="step" type="button" data-action="date-step" data-amount="-1" data-index="${index}" aria-label="1日前">-</button>
                <input type="date" data-field="postDate" data-index="${index}" value="${escapeHtml(row.postDate)}" aria-label="No.${index + 1}の投稿日">
                <button class="step" type="button" data-action="date-step" data-amount="1" data-index="${index}" aria-label="1日後">+</button>
              </div>
              <div class="file-actions">
                <button class="file-label" type="button" data-action="widget-upload" data-kind="video" data-index="${index}">動画を入れる</button>
                <button class="file-label" type="button" data-action="widget-upload" data-kind="thumb" data-index="${index}">サムネ変更</button>
                <button class="download-button" type="button" data-action="download-video" data-index="${index}" ${savedVideo ? "" : "disabled"}>動画保存</button>
                <button class="download-button" type="button" data-action="download-thumb" data-index="${index}" ${thumb ? "" : "disabled"}>サムネ保存</button>
                ${uploadStatusMarkup(row)}
              </div>
            </div>
          </article>
        `;
      }).join("");

      scheduleList.innerHTML = rows.map((row, index) => `
        <div class="schedule-row">
          <strong>No.${index + 1}</strong>
          <input type="date" data-field="postDate" data-index="${index}" value="${escapeHtml(row.postDate)}" aria-label="No.${index + 1}の投稿日">
          <input class="schedule-title" data-field="title" data-index="${index}" value="${escapeHtml(row.title)}" aria-label="No.${index + 1}のタイトル">
          <button class="status ${row.ready ? "ready" : ""}" type="button" data-action="ready" data-index="${index}">
            ${row.ready ? "準備OK" : "未完了"}
          </button>
          ${postedButtonMarkup(row, index, true)}
        </div>
      `).join("");

      renderHistory();
    }

    function historyCards(snapshot) {
      return `
        <div class="video-grid">
          ${(snapshot.rows || []).map((row, index) => `
            <article class="video-card ${row.tiktokPosted ? "is-posted" : ""}">
              <button class="visual" type="button" data-history-preview="${escapeHtml(snapshot.month)}" data-index="${index}">
                ${renderVisual(row, index)}
              </button>
              <div class="card-content">
                <div class="number-line"><span>No.${index + 1}</span><span>${formatDate(row.postDate)}</span></div>
                <p><strong>${escapeHtml(row.title)}</strong></p>
                ${row.tiktokPosted ? `<p class="status ready">TikTok投稿済み</p>` : ""}
                <div class="file-actions">
                  <button class="download-button" type="button" data-action="download-history-video" data-month="${escapeHtml(snapshot.month)}" data-index="${index}" ${savedVideoSource(row) ? "" : "disabled"}>動画保存</button>
                  <button class="download-button" type="button" data-action="download-history-thumb" data-month="${escapeHtml(snapshot.month)}" data-index="${index}" ${thumbSource(row) ? "" : "disabled"}>サムネ保存</button>
                </div>
              </div>
            </article>
          `).join("")}
        </div>
      `;
    }

    function renderHistory() {
      const months = Object.keys(state.archives || {}).sort().reverse();
      if (!months.length) {
        historyList.innerHTML = `<div class="empty">保存した月はまだありません</div>`;
        return;
      }
      historyList.innerHTML = months.map((month) => {
        const snapshot = state.archives[month];
        return `
          <details class="history-month">
            <summary>${formatMonth(month)}<span>${snapshot.rows?.length || 0}本</span></summary>
            <div class="history-content">
              <div class="history-actions">
                <button class="button primary small" type="button" data-action="restore" data-month="${month}">この月を編集する</button>
                <button class="button danger small" type="button" data-action="delete-history" data-month="${month}">履歴から削除</button>
              </div>
              ${historyCards(snapshot)}
            </div>
          </details>
        `;
      }).join("");
    }

    function openMedia(row) {
      const videos = videoPlaybackSources(row);
      const thumb = thumbSource(row);
      mediaVideo.pause();
      mediaVideo.hidden = true;
      mediaImage.hidden = true;
      mediaVideo.innerHTML = "";
      mediaVideo.removeAttribute("src");
      mediaVideo.removeAttribute("poster");
      mediaImage.removeAttribute("src");
      mediaTitle.textContent = row.title || "プレビュー";
      setMediaStatus("");
      if (videos.length) {
        videos.forEach((url) => {
          const source = document.createElement("source");
          source.src = url;
          const type = videoMimeType(url);
          if (type) source.type = type;
          mediaVideo.appendChild(source);
        });
        if (thumb) mediaVideo.poster = thumb;
        mediaVideo.hidden = false;
        setMediaStatus("動画を読み込んでいます。再生ボタンでアプリ内再生できます");
        mediaDialog.showModal();
        mediaVideo.load();
        return;
      } else if (thumb) {
        mediaImage.src = thumb;
        mediaImage.alt = `${row.title}のサムネイル`;
        mediaImage.hidden = false;
      } else {
        showToast("動画・サムネがまだありません");
        return;
      }
      mediaDialog.showModal();
    }

    function extensionFromUrl(url, fallback) {
      const clean = String(url || "").split("?")[0];
      const match = clean.match(/\.([a-zA-Z0-9]{2,5})$/);
      return match ? `.${match[1]}` : fallback;
    }

    function cloudinaryAttachmentUrl(url) {
      const value = String(url || "");
      if (!value.includes("res.cloudinary.com")) return value;
      const [clean, suffix = ""] = value.split(/(?=[?#])/);
      return `${clean.replace(/\/(image|video|raw)\/upload\//, "/$1/upload/fl_attachment/")}${suffix}`;
    }

    function downloadAsset(url, filename) {
      if (!url) return;
      const link = document.createElement("a");
      link.href = cloudinaryAttachmentUrl(url);
      link.download = filename;
      link.target = "_blank";
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast("保存を開始しました");
    }

    function safeFileTitle(row, index) {
      return String(row.title || `動画${index + 1}`).replace(/[\\/:*?"<>|]/g, "_");
    }

    function downloadRowAsset(row, kind, index) {
      const title = safeFileTitle(row, index);
      if (kind === "video") {
        const url = savedVideoSource(row);
        if (!url) {
          showToast("共有保存が終わってから動画保存できます", 5000);
          return;
        }
        downloadAsset(url, `${title}_動画${extensionFromUrl(url, ".mp4")}`);
      } else {
        const url = thumbSource(row);
        downloadAsset(url, `${title}_サムネ${extensionFromUrl(url, ".jpg")}`);
      }
    }

    function populateSettings() {
      const active = state.active;
      $("#shootDate").value = active.shootDate || "";
      $("#startDate").value = active.startDate || active.rows?.[0]?.postDate || "";
      $("#interval").value = String(active.interval || "7");
      $("#channel").value = active.channel || "YouTube";
      $("#titles").value = (active.rows || []).map((row) => row.title).join("\n");
    }

    const uploadKindName = (kind) => kind === "video" ? "動画" : "サムネ";
    let uploadWidgetScriptPromise = null;

    function loadUploadWidget() {
      if (window.cloudinary?.createUploadWidget) return Promise.resolve();
      if (uploadWidgetScriptPromise) return uploadWidgetScriptPromise;
      uploadWidgetScriptPromise = new Promise((resolve, reject) => {
        const existing = document.querySelector("script[data-cloudinary-widget]");
        if (existing) {
          existing.addEventListener("load", resolve, { once: true });
          existing.addEventListener("error", () => reject(new Error("アップロード画面を読み込めませんでした")), { once: true });
          return;
        }
        const script = document.createElement("script");
        script.src = "https://upload-widget.cloudinary.com/global/all.js";
        script.async = true;
        script.dataset.cloudinaryWidget = "true";
        script.onload = resolve;
        script.onerror = () => reject(new Error("アップロード画面を読み込めませんでした"));
        document.head.appendChild(script);
      }).then(() => {
        if (!window.cloudinary?.createUploadWidget) throw new Error("アップロード画面を起動できませんでした");
      });
      return uploadWidgetScriptPromise;
    }

    function applyUploadedAsset(row, kind, info, fileName) {
      if (kind === "video") {
        row.videoUrl = info.secure_url;
        row.videoPlaybackUrl = cloudinaryVideoPlaybackUrl(info.secure_url);
        row.videoFileName = fileName || info.original_filename || info.display_name || info.public_id || "video";
      } else {
        row.thumbUrl = info.secure_url;
        row.thumbName = fileName || info.original_filename || info.display_name || info.public_id || "thumbnail";
      }
    }

    function clearLocalVideoPreview(row) {
      if (row?.localVideoPreviewUrl) {
        URL.revokeObjectURL(row.localVideoPreviewUrl);
        row.localVideoPreviewUrl = "";
      }
    }

    function setLocalVideoPreview(row, file) {
      clearLocalVideoPreview(row);
      row.localVideoPreviewUrl = URL.createObjectURL(file);
      row.videoFileName = file.name;
    }

    function setVideoUploadStatus(row, message, progress = 0) {
      row.videoUploadStatus = message;
      row.videoUploadProgress = progress;
      render();
    }

    function clearVideoUploadStatus(row) {
      row.videoUploadStatus = "";
      row.videoUploadProgress = 0;
      row.videoUploadError = "";
    }

    function fallbackFilePick(kind, index) {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = kind === "video" ? "video/*" : "image/*";
      input.addEventListener("change", () => {
        const file = input.files?.[0];
        if (file) uploadFile(file, kind, index);
      }, { once: true });
      input.click();
    }

    async function openUploadWidget(kind, index) {
      const row = state.active.rows[index];
      if (!row) return;
      if (kind === "video") {
        row.videoUploadError = "";
        setVideoUploadStatus(row, "Cloudinary公式アップロード画面を開いています（100MB超も対応）", 1);
      }
      showToast(`${uploadKindName(kind)}アップロード画面を開きます`, kind === "video" ? 5000 : 3000);
      try {
        await loadUploadWidget();
      } catch (error) {
        if (kind === "video") {
          row.videoUploadError = cloudinaryErrorMessage(error, "公式アップロード画面を開けませんでした");
          setVideoUploadStatus(row, "公式画面を開けないため通常選択に切り替えます", 0);
        }
        showToast("通常アップロードに切り替えます", 3000);
        fallbackFilePick(kind, index);
        return;
      }

      let completed = false;
      const widget = window.cloudinary.createUploadWidget({
        cloudName: CLOUDINARY.cloudName,
        uploadPreset: CLOUDINARY.uploadPreset,
        sources: ["local"],
        multiple: false,
        maxFiles: 1,
        resourceType: kind === "video" ? "video" : "image",
        clientAllowedFormats: kind === "video" ? ["mp4", "mov", "m4v", "webm"] : ["jpg", "jpeg", "png", "webp"],
        maxChunkSize: CHUNK_UPLOAD_BYTES,
        showAdvancedOptions: false,
        cropping: false
      }, async (error, result) => {
        if (error) {
          const message = cloudinaryErrorMessage(error);
          setConnection("offline", "保存失敗");
          if (kind === "video") {
            const latestRow = state.active.rows[index];
            latestRow.videoUploadError = message;
            setVideoUploadStatus(latestRow, "アップロード失敗。まだ他の人には共有されていません", 0);
          }
          showToast(`アップロード失敗: ${message}`, 9000);
          return;
        }
        if (!result) return;
        if (kind === "video" && result.event === "upload-added") {
          const size = result.info?.file?.size || result.info?.size || 0;
          setVideoUploadStatus(row, size
            ? `動画サイズ ${formatFileSize(size)}。公式画面でアップロード中です（短くしません）`
            : "公式画面でアップロード中です（動画は短くしません）", 5);
        }
        if (result.event === "queues-start") {
          setConnection("saving", "アップロード中");
          if (kind === "video") setVideoUploadStatus(row, "Cloudinary公式アップロード中です（動画は短くしません）", 10);
          showToast(`${uploadKindName(kind)}をアップロード中です`, 2600);
        }
        if (result.event !== "success" || completed) return;
        completed = true;
        const info = result.info || {};
        if (!info.secure_url) {
          setConnection("offline", "保存失敗");
          if (kind === "video") {
            row.videoUploadError = "アップロード後のURLを取得できませんでした";
            setVideoUploadStatus(row, "アップロード失敗。URLを取得できませんでした", 0);
          }
          showToast("アップロード失敗: URLを取得できませんでした", 9000);
          return;
        }
        try {
          const latestRow = state.active.rows[index];
          applyUploadedAsset(latestRow, kind, info, info.original_filename || info.display_name);
          if (kind === "video") setVideoUploadStatus(latestRow, "全員の画面へ保存中です", 100);
          render();
          await persistState("アップロードを全員の画面に反映しました");
          if (kind === "video") {
            clearVideoUploadStatus(latestRow);
            render();
          }
          widget.close({ quiet: true });
        } catch (saveError) {
          const message = cloudinaryErrorMessage(saveError, "もう一度試してください");
          setConnection("offline", "保存失敗");
          if (kind === "video") {
            const latestRow = state.active.rows[index];
            latestRow.videoUploadError = message;
            setVideoUploadStatus(latestRow, "アップロード後の共有保存に失敗しました", 0);
          }
          showToast(`アップロード後の保存失敗: ${message}`, 9000);
        }
      });
      widget.open();
    }

    function uploadDirect(file, kind, safeName, onProgress = () => {}) {
      const form = new FormData();
      form.append("file", file, safeName);
      form.append("upload_preset", CLOUDINARY.uploadPreset);
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open("POST", uploadUrl(kind === "video" ? "video" : "auto"));
        request.timeout = 10 * 60 * 1000;
        request.upload.onprogress = (event) => {
          if (!event.lengthComputable) return;
          onProgress(Math.min(99, Math.round((event.loaded / event.total) * 100)));
        };
        request.onload = () => {
          let result = {};
          try {
            result = JSON.parse(request.responseText || "{}");
          } catch {
            result = {};
          }
          if (request.status >= 200 && request.status < 300) {
            onProgress(100);
            resolve(result);
          } else {
            reject(new Error(cloudinaryRequestError(request, result, "アップロードできませんでした")));
          }
        };
        request.onerror = () => reject(new Error("アップロード中に通信が切れました"));
        request.ontimeout = () => reject(new Error("アップロードがタイムアウトしました"));
        request.send(form);
      });
    }

    function parseUploadResponse(text) {
      try {
        return JSON.parse(text || "{}");
      } catch {
        return {};
      }
    }

    function uploadChunkPart({ chunk, safeName, resourceType, uploadId, start, end, total, onProgress = () => {} }) {
      let lastError;
      const runAttempt = (attempt) => new Promise((resolve, reject) => {
        const form = new FormData();
        form.append("file", chunk, safeName);
        form.append("upload_preset", CLOUDINARY.uploadPreset);
        const request = new XMLHttpRequest();
        request.open("POST", uploadUrl(resourceType));
        request.timeout = 10 * 60 * 1000;
        request.setRequestHeader("X-Unique-Upload-Id", uploadId);
        request.setRequestHeader("Content-Range", `bytes ${start}-${end}/${total}`);
        request.upload.onprogress = (event) => {
          if (!event.lengthComputable) return;
          onProgress(Math.min(99, Math.round(((start + event.loaded) / total) * 100)));
        };
        request.onload = () => {
          const result = parseUploadResponse(request.responseText);
          if (request.status >= 200 && request.status < 300) {
            resolve(result);
          } else {
            reject(new Error(cloudinaryRequestError(request, result, "分割アップロード失敗")));
          }
        };
        request.onerror = () => reject(new Error("通信が切れました"));
        request.ontimeout = () => reject(new Error("アップロードがタイムアウトしました"));
        request.send(form);
      });

      return (async () => {
        for (let attempt = 0; attempt < 4; attempt += 1) {
          try {
            return await runAttempt(attempt);
          } catch (error) {
            lastError = error;
            await new Promise((resolve) => setTimeout(resolve, 900 * (attempt + 1)));
          }
        }
        throw lastError || new Error("分割アップロードできませんでした");
      })();
    }

    async function uploadChunkedDirect(file, kind, safeName, onProgress = () => {}, onChunk = () => {}) {
      if (file.size > 1024 * 1024 * 1024) {
        throw new Error("1GBを超える動画はCloudinaryの制限で失敗する場合があります");
      }
      const resourceType = kind === "video" ? "video" : "auto";
      const uploadId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      let finalResult = null;
      const totalChunks = Math.ceil(file.size / CHUNK_UPLOAD_BYTES);
      for (let start = 0; start < file.size; start += CHUNK_UPLOAD_BYTES) {
        const end = Math.min(start + CHUNK_UPLOAD_BYTES - 1, file.size - 1);
        const chunk = file.slice(start, end + 1);
        const chunkNumber = Math.floor(start / CHUNK_UPLOAD_BYTES) + 1;
        onChunk(chunkNumber, totalChunks);
        finalResult = await uploadChunkPart({
          chunk,
          safeName,
          resourceType,
          uploadId,
          start,
          end,
          total: file.size,
          onProgress
        });
        onProgress(Math.min(99, Math.round(((end + 1) / file.size) * 100)));
      }
      if (!finalResult?.secure_url) throw new Error("アップロード後の動画URLを取得できませんでした");
      onProgress(100);
      return finalResult;
    }

    async function uploadFile(file, kind, index) {
      showToast(`${kind === "video" ? "動画" : "サムネ"}をアップロード中です`);
      setConnection("saving", "保存中");
      const active = state.active;
      const row = active.rows[index];
      if (!row) return;
      try {
        const safeName = file.name.replace(/[^\w.\-]+/g, "_").slice(-80);
        const uploadName = safeName;
        const displayName = file.name;
        if (kind === "video") {
          const sizeLabel = formatFileSize(file.size);
          setLocalVideoPreview(row, file);
          setVideoUploadStatus(row, `選択した動画を表示しました（${sizeLabel}）。共有用に準備中です`, 2);
          showToast(`動画を先に表示しました（${sizeLabel}）。共有反映までこのまま待ってください`, 5000);
        }
        let result;
        if (kind === "video" && file.size > MAX_DIRECT_UPLOAD_BYTES) {
          let chunkLabel = "";
          setVideoUploadStatus(row, "大きい動画を高速分割アップロード中 0%（動画は短くしません）", 0);
          result = await uploadChunkedDirect(file, kind, uploadName, (percent) => {
            setVideoUploadStatus(row, `大きい動画を高速分割アップロード中 ${percent}% ${chunkLabel}（動画は短くしません）`, percent);
          }, (chunkNumber, totalChunks) => {
            chunkLabel = `(${chunkNumber}/${totalChunks})`;
            setVideoUploadStatus(row, `大きい動画を高速分割アップロード中 ${row.videoUploadProgress || 0}% ${chunkLabel}（動画は短くしません）`, row.videoUploadProgress || 0);
          });
        } else {
          if (kind === "video") setVideoUploadStatus(row, "共有アップロード中 0%", 0);
          result = await uploadDirect(file, kind, uploadName, (percent) => {
            if (kind === "video") setVideoUploadStatus(row, `共有アップロード中 ${percent}%`, percent);
          });
        }
        applyUploadedAsset(row, kind, result, displayName);
        if (kind === "video") {
          clearLocalVideoPreview(row);
          setVideoUploadStatus(row, "全員の画面へ保存中です", 100);
        }
        render();
        await persistState("アップロードを全員の画面に反映しました");
        if (kind === "video") {
          clearVideoUploadStatus(row);
          render();
        }
      } catch (error) {
        setConnection("offline", "保存失敗");
        if (kind === "video") {
          row.videoUploadError = error.message || "もう一度試してください";
          setVideoUploadStatus(row, "アップロード失敗。まだ他の人には共有されていません", 0);
        }
        showToast(`アップロード失敗: ${error.message || "もう一度試してください"}`, 9000);
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.textContent = "";
      if ($("#passcode").value !== CLOUDINARY.password) {
        loginError.textContent = "パスワードが違います";
        return;
      }
      unlockApp();
      await loadLatest({ quiet: true });
    });

    $("#openSettings").addEventListener("click", () => {
      populateSettings();
      settingsDialog.showModal();
    });
    $("#closeSettings").addEventListener("click", () => settingsDialog.close());
    $("#cancelSettings").addEventListener("click", () => settingsDialog.close());

    $("#settingsForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const active = state.active;
      active.shootDate = $("#shootDate").value;
      active.startDate = $("#startDate").value;
      active.interval = $("#interval").value;
      active.channel = $("#channel").value;
      const titles = $("#titles").value.split(/\r?\n/).map((item) => item.trim()).filter(Boolean);
      const interval = Number(active.interval || 7);
      active.rows.forEach((row, index) => {
        if (titles[index]) row.title = titles[index];
        if (active.startDate) row.postDate = addDays(active.startDate, index * interval);
      });
      settingsDialog.close();
      render();
      await persistState("設定を全員に反映しました");
    });

    function handleFieldInput(event) {
      const index = Number(event.target.dataset.index);
      const field = event.target.dataset.field;
      if (!Number.isInteger(index) || !field || !state.active.rows[index]) return;
      state.active.rows[index][field] = event.target.value;
      if (field === "postDate" || field === "title") render();
      scheduleSave();
    }

    document.addEventListener("change", (event) => {
      if (event.target.dataset.field) handleFieldInput(event);
      if (event.target.dataset.upload) {
        const file = event.target.files?.[0];
        if (file) uploadFile(file, event.target.dataset.upload, Number(event.target.dataset.index));
        event.target.value = "";
      }
    });

    document.addEventListener("click", async (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      const index = Number(target.dataset.index);
      if (action === "widget-upload") {
        event.preventDefault();
        await openUploadWidget(target.dataset.kind, index);
        return;
      }
      if (action === "preview") openMedia(state.active.rows[index]);
      if (action === "ready") {
        state.active.rows[index].ready = !state.active.rows[index].ready;
        render();
        scheduleSave();
      }
      if (action === "toggle-posted") {
        const row = state.active.rows[index];
        row.tiktokPosted = !row.tiktokPosted;
        row.tiktokPostedAt = row.tiktokPosted ? new Date().toISOString() : "";
        render();
        await persistState(row.tiktokPosted ? "TikTok投稿済みにしました" : "TikTok未投稿に戻しました");
      }
      if (action === "date-step") {
        state.active.rows[index].postDate = addDays(state.active.rows[index].postDate, Number(target.dataset.amount));
        render();
        scheduleSave();
      }
      if (action === "download-video") downloadRowAsset(state.active.rows[index], "video", index);
      if (action === "download-thumb") downloadRowAsset(state.active.rows[index], "thumb", index);
      if (action === "download-history-video") downloadRowAsset(state.archives[target.dataset.month].rows[index], "video", index);
      if (action === "download-history-thumb") downloadRowAsset(state.archives[target.dataset.month].rows[index], "thumb", index);
      if (action === "restore") {
        const month = target.dataset.month;
        state.active = structuredClone(state.archives[month]);
        render();
        await persistState(`${formatMonth(month)}を編集画面へ戻しました`);
      }
      if (action === "delete-history") {
        const month = target.dataset.month;
        if (!confirm(`${formatMonth(month)}の履歴を削除しますか？`)) return;
        delete state.archives[month];
        render();
        await persistState("履歴を削除しました");
      }
    });

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-history-preview]");
      if (!target) return;
      const snapshot = state.archives[target.dataset.historyPreview];
      openMedia(snapshot.rows[Number(target.dataset.index)]);
    });

    mediaDialog.addEventListener("click", (event) => {
      if (event.target === mediaDialog) mediaDialog.close();
    });
    $("#closeMedia").addEventListener("click", () => mediaDialog.close());
    mediaDialog.addEventListener("close", () => {
      mediaVideo.pause();
      mediaVideo.innerHTML = "";
      mediaVideo.removeAttribute("src");
      mediaVideo.removeAttribute("poster");
      setMediaStatus("");
    });
    mediaVideo.addEventListener("loadedmetadata", () => setMediaStatus(""));
    mediaVideo.addEventListener("playing", () => setMediaStatus(""));
    mediaVideo.addEventListener("waiting", () => {
      if (!mediaVideo.hidden) setMediaStatus("動画を読み込んでいます");
    });
    mediaVideo.addEventListener("error", () => {
      if (!mediaVideo.hidden) setMediaStatus("動画を再生準備中です。少し待ってから更新してもう一度開いてください");
    });

    $("#addSlot").addEventListener("click", async () => {
      const rows = state.active.rows;
      const interval = Number(state.active.interval || 7);
      const lastDate = rows.at(-1)?.postDate || state.active.startDate || `${state.active.month}-01`;
      rows.push(blankRow(rows.length, addDays(lastDate, interval)));
      render();
      await persistState("枠を追加しました");
    });

    $("#clearCurrent").addEventListener("click", async () => {
      if (!confirm(`${formatMonth(state.active.month)}の動画とサムネをすべて削除しますか？`)) return;
      state.active.rows = state.active.rows.map((row, index) => ({
        ...blankRow(index, row.postDate),
        postDate: row.postDate
      }));
      render();
      await persistState("今月の中身を全削除しました");
    });

    $("#archiveCurrent").addEventListener("click", async () => {
      state.archives[state.active.month] = structuredClone(state.active);
      render();
      await persistState(`${formatMonth(state.active.month)}を履歴に保存しました`);
    });

    $("#newMonth").addEventListener("click", () => {
      const current = new Date(`${state.active.month}-01T00:00:00`);
      current.setMonth(current.getMonth() + 1);
      $("#newMonthValue").value = current.toISOString().slice(0, 7);
      newMonthDialog.showModal();
    });
    $("#closeNewMonth").addEventListener("click", () => newMonthDialog.close());
    $("#cancelNewMonth").addEventListener("click", () => newMonthDialog.close());
    $("#newMonthForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      state.active = blankMonth($("#newMonthValue").value);
      newMonthDialog.close();
      render();
      await persistState("新しい月の6枠を作りました");
    });

    function moveMonth(amount) {
      const date = new Date(`${state.active.month}-01T00:00:00`);
      date.setMonth(date.getMonth() + amount);
      const month = date.toISOString().slice(0, 7);
      if (state.archives[month]) {
        state.active = structuredClone(state.archives[month]);
        render();
        persistState(`${formatMonth(month)}を表示しました`);
      } else {
        showToast("その月は履歴にありません");
      }
    }

    $("#prevMonth").addEventListener("click", () => moveMonth(-1));
    $("#nextMonth").addEventListener("click", () => moveMonth(1));
    monthPicker.addEventListener("change", () => {
      const month = monthPicker.value;
      if (month === state.active.month) return;
      if (state.archives[month]) {
        state.active = structuredClone(state.archives[month]);
        render();
        persistState(`${formatMonth(month)}を表示しました`);
      } else {
        monthPicker.value = state.active.month;
        showToast("その月は履歴にありません");
      }
    });

    $("#reloadState").addEventListener("click", () => loadLatest());

    async function pollForUpdates() {
      if (!state || hasLocalChanges || isSaving || lock.hidden === false) return;
      if (Date.now() - lastPollAt < 3500) return;
      lastPollAt = Date.now();
      try {
        const nextRevision = Number(state.revision || 0) + 1;
        const next = await fetchRevision(nextRevision);
        if (next) {
          state = normalizeState(next);
          knownMissingRevision = null;
          render();
          showToast("ほかの人の変更を反映しました");
        }
        setConnection("online", "同期中");
      } catch {
        setConnection("offline", "未接続");
      }
    }

    (async function boot() {
      if (LOCAL_TEST_UNLOCK) {
        unlockApp({ remember: false });
        state = initialState();
        render();
      } else if (localStorage.getItem("schedulerUnlocked") === "1") {
        unlockApp();
        await loadLatest({ quiet: true });
      } else {
        state = initialState();
        render();
      }
      setInterval(pollForUpdates, 4000);
    })();
  </script>
</body>
</html>
